<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'"><link id="admin-icon" rel="icon" href="../assets/favicon.png"><title>Website editor | True Homes</title><link rel="stylesheet" href="admin.css"><script type="module" src="admin.mjs"></script></head><body class="signed-out">
<div class="shell">
<header class="studio-bar"><div class="studio-brand"><img src="../assets/wordmark.png" alt="True Homes"><span>Website editor</span></div><div class="studio-actions"><button id="preview">Preview</button><button id="publish" class="primary" disabled>Publish</button></div></header>
<aside><nav id="tabs" aria-label="Editor navigation"></nav><a href="../index.html" target="_blank" rel="noopener">View website ↗</a></aside>
<main><div class="mobile-switch" aria-label="Editor view"><button id="show-settings" aria-pressed="true">Settings</button><button id="show-canvas" aria-pressed="false">Live preview</button></div><div class="workspace"><div class="settings-column"><section id="panel"></section></div>
<section id="canvas" aria-label="Live website preview" hidden><div class="canvas-tools"><strong>Live preview</strong><button id="inspect" aria-pressed="false">Select section</button><div class="device"><button id="wide" aria-pressed="true">Desktop</button><button id="narrow" aria-pressed="false">Phone</button></div></div><div class="canvas-area"><iframe id="live" title="Live draft preview"></iframe></div></section></div>
<footer class="studio-status"><span id="connection"></span><span id="status" role="status" aria-live="polite">Loading your editor…</span></footer></main></div>
<section id="login" aria-labelledby="login-title"><div class="identity"><img src="../assets/wordmark.png" alt="True Homes"><h1 id="login-title">Sign in</h1><form id="credentials"><label>User ID<input required autocomplete="username" id="user" spellcheck="false" autocapitalize="none"></label><label>Password<input required type="password" autocomplete="current-password" id="password"></label><button id="connect" class="primary">Sign in</button></form><p id="login-error" role="status"></p></div><div class="login-footer">True Homes · Website editor</div></section>
<dialog id="viewer"><div class="tools"><select id="preview-page" aria-label="Page to preview"></select><button id="phone">Phone width</button><button id="desktop">Full width</button><button id="close-preview">Close</button></div><iframe id="frame" title="Draft website preview"></iframe></dialog>
</body></html>
